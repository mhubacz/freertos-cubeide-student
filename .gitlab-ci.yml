# GitLab Pages (pages.kia.prz.edu.pl). GitHub ignoruje ten plik.
# Strona: https://pages.kia.prz.edu.pl/<login>/<projekt>/
pages:
  image: alpine:latest
  script:
    - mkdir -p public && cp -r docs/* public/
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
